<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snooker Elo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Snooker Elo</h1>
        <p id="status">Loading</p>
      </div>
      <form id="controls">
        <input id="date" type="date" />
        <select id="rating">
          <option value="match">Match Elo</option>
          <option value="frame">Frame Elo</option>
        </select>
        <button type="submit">Refresh</button>
      </form>
    </header>

    <main>
      <section class="leaderboard">
        <div class="section-title">
          <h2>Leaderboard</h2>
          <span id="meta"></span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Match Elo</th>
              <th>Frame Elo</th>
              <th>Matches</th>
            </tr>
          </thead>
          <tbody id="leaderboard"></tbody>
        </table>
      </section>

      <aside>
        <section>
          <div class="section-title">
            <h2>Players</h2>
          </div>
          <form id="player-search">
            <input id="search" type="search" placeholder="Search player" />
            <button type="submit">Find</button>
          </form>
          <div id="players"></div>
        </section>

        <section>
          <div class="section-title">
            <h2>Player</h2>
          </div>
          <div id="player-detail"></div>
        </section>

        <section>
          <div class="section-title">
            <h2>Compare</h2>
          </div>
          <div id="compare-list"></div>
          <button id="clear-compare" type="button">Clear</button>
          <div id="compare"></div>
        </section>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
