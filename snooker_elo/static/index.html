<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snooker Elo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Snooker Elo</h1>
        <p id="status">Loading</p>
      </div>
      <form id="controls" class="controls">
        <label>
          Rating
          <select id="rating">
            <option value="match">Match Elo</option>
            <option value="frame">Frame Elo</option>
          </select>
        </label>
        <label>
          Leaderboard Date
          <input id="date" type="date" />
        </label>
        <label>
          From
          <input id="start-year" type="number" min="1900" max="2100" step="1" />
        </label>
        <label>
          To
          <input id="end-year" type="number" min="1900" max="2100" step="1" />
        </label>
        <button type="submit">Refresh</button>
      </form>
    </header>

    <main class="dashboard">
      <section class="panel compare-panel">
        <div class="panel-head">
          <div>
            <h2>Elo Evolution</h2>
            <span id="meta"></span>
          </div>
          <form id="player-search" class="search">
            <input id="search" type="search" placeholder="Search player" />
            <button type="submit">Add</button>
          </form>
        </div>
        <div id="players" class="search-results"></div>
        <div id="compare-list" class="chips"></div>
        <canvas id="compare-chart" width="1100" height="420"></canvas>
      </section>

      <section class="panel eras-panel">
        <div class="panel-head">
          <div>
            <h2>Yearly No.1</h2>
            <span id="era-range"></span>
          </div>
        </div>
        <canvas id="era-chart" width="1100" height="220"></canvas>
        <div id="dominance" class="dominance-list"></div>
      </section>

      <section class="panel leaderboard-panel">
        <div class="panel-head">
          <h2>Leaderboard</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Match Elo</th>
              <th>Frame Elo</th>
              <th>Matches</th>
            </tr>
          </thead>
          <tbody id="leaderboard"></tbody>
        </table>
      </section>

      <section class="panel player-panel">
        <div class="panel-head">
          <h2>Player</h2>
        </div>
        <div id="player-detail"></div>
        <canvas id="history-chart" width="720" height="260"></canvas>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
